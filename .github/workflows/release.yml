name: Build and Release Fonts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fontmake fonttools brotli

      - name: Build fonts
        run: ./build-font.sh   # your script, adjust the name

      - name: Zip delivery folder
        run: |
          cd timesnewwoman-fonts
          zip -r ../timesnewwoman-fonts.zip .
          cd ..

      # Always available for testing, downloadable from the run page
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: timesnewwoman-fonts
          path: timesnewwoman-fonts.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: timesnewwoman-fonts.zip
          body: |
            Prebuilt fonts for version ${{ github.ref_name }}.
            Includes TTF and WOFF2 formats.